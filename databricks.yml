bundle:
  name: fda_510k_predicate_lineage

include:
  - resources/*.yml

# Workspace-specific values are not stored here. They come from environment
# variables (see .env.example):
#   DATABRICKS_CONFIG_PROFILE  which workspace to deploy to (profile in ~/.databrickscfg)
#   BUNDLE_VAR_catalog         value for var.catalog
#   BUNDLE_VAR_schema          value for var.schema
#   BUNDLE_VAR_warehouse_id    value for var.warehouse_id
variables:
  catalog:
    description: Unity Catalog catalog for all tables and the Volume
  schema:
    description: Schema for all tables and the Volume
  warehouse_id:
    description: SQL warehouse that runs the dbt task
  volume:
    description: Volume for raw files (openFDA exports and PDFs)
    default: fda_raw_pdfs
  table_prefix:
    description: Prefix for table names, needed when the schema is shared with other projects
    default: fda_
  product_codes:
    description: Comma-separated FDA product codes that define the PDF sample
    default: JDI,LPH,LZO
  max_pdfs:
    description: New PDFs downloaded per run
    default: "15"
  ai_batch_limit:
    description: Max documents parsed and extracted per run (caps AI cost; above max_pdfs to absorb backlog)
    default: "30"

artifacts:
  fda_ingest_wheel:
    type: whl
    path: .
    build: uv build --wheel

targets:
  # For testing: resources get a "[dev <user>]" prefix and schedules are paused.
  dev:
    mode: development
    default: true

  # The scheduled daily pipeline. No development mode, so the schedule is active.
  prod:
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/prod
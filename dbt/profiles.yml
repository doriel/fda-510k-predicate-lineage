# No workspace details in this file: everything comes from environment
# variables set in .env (see .env.example at the repo root).
# Authentication is OAuth in the browser (U2M), so no token is stored anywhere.
fda_510k:
  target: dev
  outputs:
    dev:
      type: databricks
      host: "{{ env_var('DBT_DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DBT_DATABRICKS_HTTP_PATH') }}"
      catalog: "{{ env_var('BUNDLE_VAR_catalog') }}"
      schema: "{{ env_var('BUNDLE_VAR_schema') }}"
      auth_type: oauth
      threads: 4
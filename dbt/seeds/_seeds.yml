version: 2

seeds:
  - name: recall_gap_review
    description: >
      Manual review of the recall check (int_extraction_recall_gaps), prompt v2,
      sample of 82 documents, reviewed 2026-09-28. One row per K-number found by
      regex in a document but not extracted by the LLM, classified by reading the
      surrounding text. is_real_miss = true means the LLM should have extracted it.
    config:
      column_types:
        document_k_number: string
        candidate_k_number: string
        category: string
        is_real_miss: boolean
        note: string
    data_tests:
      - unique:
          arguments:
            column_name: "document_k_number || '|' || candidate_k_number"
    columns:
      - name: category
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [real_miss, compatible_device, product_family, co_submission, ocr_artifact]
      - name: is_real_miss
        data_tests:
          - not_null

  - name: name_match_review
    description: >
      Manual review of the name matches (int_name_resolution, match_status = matched),
      prompt v2, thresholds 0.6 score and 0.1 margin, reviewed 2026-09-28.
      One row per matched citation. verdict: correct (clearly the cited device),
      plausible (likely, not confirmable without the PDF), wrong.
    config:
      column_types:
        subject_k_number: string
        cited_device_name: string
        matched_k_number: string
        verdict: string
        note: string
    data_tests:
      - unique:
          arguments:
            column_name: "subject_k_number || '|' || cited_device_name"
    columns:
      - name: verdict
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [correct, plausible, wrong]
      - name: matched_k_number
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_openfda__submissions')
                field: k_number
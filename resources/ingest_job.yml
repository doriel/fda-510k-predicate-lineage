resources:
  jobs:
    fda_ingest:
      name: fda_ingest
      description: Load openFDA 510(k) metadata, then download summary PDFs for the sample

      tasks:
        - task_key: load_openfda
          environment_key: default
          python_wheel_task:
            package_name: fda_ingest
            entry_point: load_openfda
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --volume
              - ${var.volume}
              - --table-prefix
              - ${var.table_prefix}

        - task_key: load_pdfs
          depends_on:
            - task_key: load_openfda
          environment_key: default
          python_wheel_task:
            package_name: fda_ingest
            entry_point: load_pdfs
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --volume
              - ${var.volume}
              - --table-prefix
              - ${var.table_prefix}
              - --product-codes
              - ${var.product_codes}
              - --max-pdfs
              - ${var.max_pdfs}

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ../dist/*.whl